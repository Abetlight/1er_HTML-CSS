    <div class="titre_front">
    <p class="titre_form"><strong>Formulaire d'inscription</strong></p>
    </div>

    <form class="formulaire">
        <label>Nom:</label>
        <input type="text" placeholder="Saisir nom" required/>
        <label>Prénom:</label>
        <input type="text" placeholder="Saisir prénom" required/>
        <label>Etablissement d'inscription</label>
       <select>
            <option>Ville</option>
            <option>Furiani</option>
            <option>Ajaccio</option>
        </select><br>
        <label>Mail:</label>
        <input type="email" placeholder="email@domaine.com" required/>
        <button type="submit">Formulaire</button>
    </form>
</body>
